<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forgot password — Mithra</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <button class="back" onclick="location.href='login.html'">&#8592;</button>
      <h2>Reset password</h2>
    </div>
    <p class="sub">Enter your account email and we'll send you a reset link.</p>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="error" id="err"></div>
      <div class="notice" id="notice"></div>
      <button class="btn btn-primary" type="submit" id="submitBtn">Send reset link</button>
    </form>

    <div id="devLink" class="hidden" style="margin-top: 18px;">
      <p class="sub">Demo mode (no email server configured) — continue here:</p>
      <a id="continueLink" class="btn btn-teal" style="text-decoration:none; display:block;">Continue to reset password</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("err");
      const notice = document.getElementById("notice");
      const btn = document.getElementById("submitBtn");
      errEl.textContent = ""; notice.textContent = "";
      btn.disabled = true; btn.textContent = "Sending...";
      try {
        const data = await api("/auth/forgot-password", {
          method: "POST",
          body: { email: document.getElementById("email").value },
        });
        notice.textContent = "If that email exists, a reset link has been sent.";
        if (data.devResetToken) {
          document.getElementById("devLink").classList.remove("hidden");
          document.getElementById("continueLink").href = `reset.html?token=${data.devResetToken}`;
        }
      } catch (err) {
        errEl.textContent = err.message;
      } finally {
        btn.disabled = false; btn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
