<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login — Mithra</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="screen">
    <div class="brand">
      <h2>Login</h2>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password:</label>
        <div class="pw-wrap">
          <input id="password" type="password" placeholder="Your password" required />
          <button type="button" id="toggle1" aria-label="Show password" title="Show password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div style="text-align:right; margin: -8px 0 14px;">
        <button type="button" class="link-btn" onclick="location.href='forgot.html'">forgot password?</button>
      </div>

      <div class="error" id="err"></div>
      <button class="btn btn-primary" type="submit" id="submitBtn">Login</button>
    </form>

    <img class="mithra-mark" src="assets/logo.png" alt="Mithra logo" style="margin-top: 40px;" />
    <p style="text-align:center; color: var(--mist); font-weight:700; margin-top: 6px;">
      MITHRA<br /><span style="font-weight:500; font-size:0.85rem;">Man Ka Mitra AI</span>
    </p>

    <div class="link-row">New here? <a href="signup.html">Sign up</a></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const toggleBtn = document.getElementById("toggle1");
    const pwInput = document.getElementById("password");

    const eyeSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>`;

    const eyeOffSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
      <line x1="1" y1="1" x2="23" y2="23"></line>
    </svg>`;

    toggleBtn.onclick = () => {
      const isPassword = pwInput.type === "password";
      pwInput.type = isPassword ? "text" : "password";
      toggleBtn.innerHTML = isPassword ? eyeOffSvg : eyeSvg;
      toggleBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
      toggleBtn.setAttribute("title", isPassword ? "Hide password" : "Show password");
    };

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("err");
      const btn = document.getElementById("submitBtn");
      errEl.textContent = "";
      btn.disabled = true; btn.textContent = "Logging in...";
      try {
        const { token, user } = await api("/auth/login", {
          method: "POST",
          body: {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          },
        });
        setSession(token, user);
        location.href = "chat.html";
      } catch (err) {
        errEl.textContent = err.message;
      } finally {
        btn.disabled = false; btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
